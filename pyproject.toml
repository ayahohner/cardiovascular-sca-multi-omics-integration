[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiovascular-sca-multi-omics-integration"
version = "0.2.0"
description = "Modular open-data endothelial and HSPC research for cardiovascular SCA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anndata>=0.12,<0.13",
  "cellrank>=2.3.2,<3",
  "h5py>=3.14,<4",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "palantir>=1.4.5,<2",
  "pandas>=2.3,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "scrublet>=0.2.3,<0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<7",
]

[project.scripts]
cardio-sca-mvp = "cardio_sca_mvp.cli:main"
hspc-fate-mvp = "hspc_fate_mvp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
markers = [
  "data: requires the admitted public source files",
]

[tool.coverage.run]
branch = true
source = ["cardio_sca_mvp", "hspc_fate_mvp"]

[tool.coverage.report]
fail_under = 85
show_missing = true
